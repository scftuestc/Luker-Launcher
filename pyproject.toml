[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM", "B", "RUF"]
# 中文全角标点不是错误
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
platform = "win32"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = '^(tests|build|release|\.zcode)([/\\]|$)'

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "build/*", "release/*", ".zcode/*"]

[tool.coverage.report]
# 覆盖率只升不降；提高后同步上调阈值
fail_under = 38
show_missing = true
skip_covered = true
